apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          - path: /api/movies(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /api/users(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /api/payments(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /api/subscriptions(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /health(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          - path: /api/events/health(/|$)(.*)
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 80
          - path: /api/events(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 80