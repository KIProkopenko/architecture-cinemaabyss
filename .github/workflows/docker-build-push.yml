name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    workflow_dispatch:            # ← добавили ручной запуск
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'cinema'
        type: string
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Monolith ---
      - name: Extract metadata for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/monolith
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Movies Service ---
      - name: Extract metadata for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Proxy Service ---
      - name: Extract metadata for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Events Service ---
      - name: Extract metadata for Events Service
        id: meta-events
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Run API Tests (locally, using docker-compose) ---
      - name: Setup Docker Compose environment
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          echo "Docker Compose installed"

      - name: Start services for API tests (monolith, movies, events, kafka, zookeeper, proxy)
        run: |
          # Создадим временный docker-compose.yml для тестов (без зависимостей от внешних сервисов)
          cat > docker-compose.test.yml << 'EOF'
version: '3.8'
services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinemaabyss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  kafka:
    image: wurstmeister/kafka:2.13-2.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "events-topic:1:1"
    depends_on:
      - zookeeper
  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
  monolith:
    build:
      context: ./src/monolith
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/cinemaabyss?sslmode=disable
    depends_on:
      - postgres
  movies-service:
    build:
      context: ./src/microservices/movies
    ports:
      - "8081:8081"
    environment:
      DB_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/cinemaabyss?sslmode=disable
    depends_on:
      - postgres
  events-service:
    build:
      context: ./src/microservices/events
    ports:
      - "8082:8082"
    environment:
      KAFKA_BROKERS: kafka:9092
      EVENT_TOPIC: events-topic
    depends_on:
      - kafka
  proxy-service:
    build:
      context: ./src/microservices/proxy
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      MONOLITH_URL: http://monolith:8080
      MOVIES_SERVICE_URL: http://movies-service:8081
      EVENTS_SERVICE_URL: http://events-service:8082
      GRADUAL_MIGRATION: "true"
      MOVIES_MIGRATION_PERCENT: "50"
    depends_on:
      - monolith
      - movies-service
      - events-service
volumes:
  pgdata:
EOF
          # Запустим только необходимые сервисы для тестов
          docker-compose -f docker-compose.test.yml up -d postgres kafka zookeeper monolith movies-service events-service proxy-service
          sleep 30  # Ждём старт всех сервисов

      - name: Run API Tests with Newman
        run: |
          cd tests/postman
          npm ci
          # Запускаем тесты против локального proxy-service (localhost:8000)
          # Используем --insecure, т.к. в CI нет HTTPS
          npx newman run cinemaabyss.postman_collection.json \
            --environment ./environments/local.json \
            --reporters cli,json \
            --folder "Events Microservice" \
            --folder "Proxy Service" \
            --folder "Movies Service" \
            --timeout-request 10000 \
            --delay-request 200

      - name: Cleanup test containers
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v
